spring.application.name=module6-jwt-oauth2-advanced
server.port=8086

spring.datasource.url=jdbc:h2:mem:module6db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT — 256-bit Base64-encoded secret for HS256
jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjcmV0IGtleSBmb3IgSldUIHNpZ25pbmcgcHVycG9zZXM=
jwt.access-expiration=900000
jwt.refresh-expiration-seconds=604800

logging.level.org.springframework.security=INFO
