spring.application.name=module7-advanced-security
server.port=8087

spring.datasource.url=jdbc:h2:mem:module7db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret for access tokens (HS256, 256-bit Base64)
jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjcmV0IGtleSBmb3IgSldUIHNpZ25pbmcgcHVycG9zZXM=
jwt.access-expiration=900000

# Brute force protection settings
security.max-login-attempts=5
security.lockout-duration-minutes=15

logging.level.org.springframework.security=INFO
logging.level.com.example.security=DEBUG
