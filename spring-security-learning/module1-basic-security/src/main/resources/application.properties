spring.application.name=module1-basic-security
server.port=8081

# Activate profile: inmemory or httpbasic
spring.profiles.active=inmemory

# Default user (overridden by our UserDetailsService bean)
# spring.security.user.name=user
# spring.security.user.password=password

# Logging - show security-related debug info
logging.level.org.springframework.security=DEBUG
logging.level.com.example.security=DEBUG

# Springdoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
