spring.application.name=module4-oauth2
server.port=8084

# ============================================================
# OAuth2 Client Configuration
# ============================================================
# To use real providers, register your app and get credentials:
# Google:  https://console.cloud.google.com/apis/credentials
# GitHub:  https://github.com/settings/applications/new
# ============================================================

# --- Google OAuth2 ---
# spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
# spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
# spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Redirect URI (register this in Google Console):
# http://localhost:8084/login/oauth2/code/google

# --- GitHub OAuth2 ---
# spring.security.oauth2.client.registration.github.client-id=YOUR_GITHUB_CLIENT_ID
# spring.security.oauth2.client.registration.github.client-secret=YOUR_GITHUB_CLIENT_SECRET
# spring.security.oauth2.client.registration.github.scope=user:email,read:user
# Redirect URI:
# http://localhost:8084/login/oauth2/code/github

# --- Custom Provider (e.g., Okta / Keycloak) ---
# spring.security.oauth2.client.registration.custom.client-id=YOUR_CLIENT_ID
# spring.security.oauth2.client.registration.custom.client-secret=YOUR_CLIENT_SECRET
# spring.security.oauth2.client.registration.custom.authorization-grant-type=authorization_code
# spring.security.oauth2.client.registration.custom.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# spring.security.oauth2.client.registration.custom.scope=openid,profile,email
# spring.security.oauth2.client.provider.custom.authorization-uri=https://your-provider/oauth2/authorize
# spring.security.oauth2.client.provider.custom.token-uri=https://your-provider/oauth2/token
# spring.security.oauth2.client.provider.custom.user-info-uri=https://your-provider/userinfo
# spring.security.oauth2.client.provider.custom.user-name-attribute=sub

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
