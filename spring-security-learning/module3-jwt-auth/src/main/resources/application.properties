spring.application.name=module3-jwt-auth
server.port=8083

# H2 database
spring.datasource.url=jdbc:h2:mem:jwtdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
# Generate a 256-bit (32 byte) Base64-encoded secret key for HS256
# In production, use environment variable, never hardcode!
jwt.secret=dGhpcyBpcyBhIHZlcnkgc2VjcmV0IGtleSBmb3IgSldUIHNpZ25pbmcgcHVycG9zZXM=
jwt.expiration=86400000
jwt.refresh-expiration=604800000

logging.level.org.springframework.security=DEBUG
